[package]
name = "lan-chat"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lan_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.21.4"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
futures-util = "0.3.34"
getrandom = "0.4"
sha2 = "0.10"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Exactly one CryptoProvider (ring): tokio-tungstenite's rustls-tls feature
# pulls no provider, and rustls panics at ClientConfig::builder() without one.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
